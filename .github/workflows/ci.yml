
name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: democyber:latest

    steps:
      # 1. Checkout avec historique complet
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Gitleaks - Détection des secrets
      - name: Run Gitleaks scan
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 2

      # 3. Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 4. Compiler le projet
      - name: Build Java project with Maven
        run: mvn clean package

      # 5. Construire l'image Docker
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # 6. Tester l'image Docker
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME

          for i in {1..15}; do
            if curl -fsS http://localhost:8080/; then
              echo "Application started successfully"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Application failed to start"
              docker logs democyber-test
              docker rm -f democyber-test
              exit 1
            fi
            sleep 2
          done

          docker rm -f democyber-test

      # 7. Scanner l'image avec Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: democyber:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      # 8. Connexion Docker Hub uniquement sur main
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Tag et publication sur Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag democyber:latest ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
